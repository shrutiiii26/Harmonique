<!-- Sidebar -->
<div *ngIf="showNavAndSidebar">
  <app-sidebar (expandedChange)="isSidebarExpanded = $event"></app-sidebar>
</div>

<!-- Navbar -->
<div *ngIf="showNavbar">
  <app-navbar></app-navbar>
</div>

<!-- Main content -->
<div class="main-content">
  <!-- Pass sidebar state to the home page -->
  <router-outlet></router-outlet>
</div>

<!-- Footer -->
<div>
  <app-footer *ngIf="showFooter"></app-footer>
</div>
