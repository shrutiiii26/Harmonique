<div class="container-fluid">
  <div class="row">
    <div class="login-card text-center">
      <div class="login-logo">
        <i class="bi bi-music-note-beamed"></i>
      </div>
      <div class="head">
        <h3 class="fw-bold mb-1 ">Harmonique</h3>
        <h5 class="mb-4">Login</h5>
      </div>

      <form>
        <div class="mb-3 text-start">
          <label for="username" class="form-label color-white">Username</label>
          <input type="text" id="username" class="form-control rounded-3" required>
        </div>        

        <div class="mb-3 text-start">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control rounded-3" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check head">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-small" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="text-decoration-none text-primary text-small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">Login</button>
