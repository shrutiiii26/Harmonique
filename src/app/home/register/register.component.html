<div class="background">
    <div class="music-notes">
        <span class="music-note" style="left: 10%; animation-delay: 0s;">♬</span>
        <span class="music-note" style="left: 30%; animation-delay: 1s;">♪</span>
        <span class="music-note" style="left: 50%; animation-delay: 2s;">♬</span>
        <span class="music-note" style="left: 70%; animation-delay: 3s;">♩</span>
        <span class="music-note" style="left: 90%; animation-delay: 4s;">♬</span>
        <span class="music-note" style="left: 20%; animation-delay: 5s;">♪</span>
      </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-card text-center p-4">
            <div class="boxes mb-3">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <h2 class="text-white mb-2">Join the Band</h2>
            <div class="d-flex justify-content-center mb-3">
                <div class="wave-icon"></div>
              </div>              
            <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" novalidate>
                <input type="text" class="form-control mb-2" placeholder="Full Name" formControlName="fullName">
                <div *ngIf="registrationForm.get('fullName')?.invalid && registrationForm.get('fullName')?.touched"
                    class="text-danger">
                    Full Name is required and should be at least 3 characters long.
                </div>

                <input type="email" class="form-control mb-2" placeholder="Email" formControlName="email">
                <div *ngIf="registrationForm.get('email')?.invalid && registrationForm.get('email')?.touched"
                    class="text-danger">
                    A valid email is required.
                </div>

                <input type="password" class="form-control mb-2" placeholder="Create Password"
                    formControlName="password">
                <div *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched"
                    class="text-danger">
                    Password is required and must be at least 6 characters.
                </div>

                <input type="password" class="form-control mb-3" placeholder="Confirm Password"
                    formControlName="confirmPassword">
                <div *ngIf="registrationForm.get('confirmPassword')?.invalid && registrationForm.get('confirmPassword')?.touched"
                    class="text-danger">
                    Confirm Password is required and must match the password.
                </div>

                <a routerLink="/home" class="btn btn-primary w-100 gradient-btn"
                    [class.disabled]="registrationForm.invalid" [attr.aria-disabled]="registrationForm.invalid"
                    (click)="registrationForm.invalid && $event.preventDefault()">
                    Register
                </a>

            </form>
            <p class="text-white mt-3">Already have an account? <a routerLink="/login" class="text-purple">Login</a></p>
        </div>
    </div>
</div>
