<div class="container-fluid py-3">

    <!-- Top bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <i class="bi bi-arrow-left head fs-4" (click)="goBack()" style="cursor: pointer;"></i>
        <h5 class="m-0 head">Liked Songs</h5>
        <i class="bi bi-sliders head fs-4"></i>
    </div>

    <!-- Song grid -->
    <div class="row g-3">
        <!-- Song Item -->
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Believer</p>
                <small class="text-secondary">IMAGINE DRAGON</small>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Shortwave</p>
                <small class="text-secondary">RYAN GRIFFIN</small>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Dream On</p>
                <small class="text-secondary">ROGER TERRY</small>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Origins</p>
                <small class="text-secondary">IMAGINE DRAGON</small>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Unknown</p>
                <small class="text-secondary">ARTIST</small>
            </div>
        </div>
        <div class="col-3">
            <div class="text-center">
                <img src="../assets/Mask Group.png" class="img-fluid rounded" />
                <p class="mt-2 mb-0 fw-semibold head">Another Song</p>
                <small class="text-secondary">ARTIST</small>
            </div>
        </div>
    </div>
</div>

<div class="bottom-player fixed-bottom">
    <div class="d-flex align-items-center">
    <a routerLink="/playing-now"><img src="../assets/Mask Group (1).png" alt="cover" style="height: 50px; border-radius: 5px;"> </a> 
        <div class="ms-3">
            <div class="album-title mb-0">Chaff & Dust</div>
            <div class="album-artist">HYONNA</div>
        </div>
    </div>


    <!-- Crossfade Range Slider -->
    <input type="range" min="0" max="50" [value]="crossfadeValue" class="form-range crossfade-slider"
        (input)="onCrossfadeChange($event)" />

    <div class="crossfade-info text-white">
        <span id="crossfadeValue">{{ crossfadeValue }}</span> seconds
    </div>

    <!-- Controls -->
    <div class="d-flex justify-content-center player-controls">
        <i class="bi bi-skip-backward-fill icon-btn"></i>
        <i class="bi bi-play-fill icon-btn"></i>
        <i class="bi bi-skip-forward-fill icon-btn"></i>
    </div>
</div>
