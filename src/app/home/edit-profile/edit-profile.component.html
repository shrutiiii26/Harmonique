<div class="edit-profile-container">
  <h1>Edit Profile</h1>

  <form>
    <!-- Profile Image -->
    <div class="text-center mb-4">
      <img [src]="previewUrl || 'https://via.placeholder.com/200'" 
           class="rounded-circle profile-img" 
           alt="Profile Picture" 
           width="200" height="200">
      
      <div class="mt-2">
        <button type="button" class="btn btn-outline-light btn-sm" (click)="fileInput.click()">
          Upload Picture
        </button>
        <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" hidden>
      </div>
    </div>
    
    <!-- Full Name -->
    <div class="mb-3">
      <label for="name" class="form-label text-light">Full Name</label>
      <input type="text" class="form-control custom-dark-input" id="name" placeholder="John Doe">
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label for="username" class="form-label text-light">Username</label>
      <input type="text" class="form-control custom-dark-input" id="username" placeholder="@johndoe">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label text-light">Email</label>
      <input type="email" class="form-control custom-dark-input" id="email" placeholder="john@example.com">
    </div>

    <!-- Bio -->
    <div class="mb-3">
      <label for="bio" class="form-label text-light">Bio</label>
      <textarea class="form-control custom-dark-input" id="bio" rows="3" placeholder="Tell us something about you..."></textarea>
    </div>

    <!-- Gender -->
    <section class="settings-group">
      <div class="setting-row">
          <h2 class="text-white">Gender</h2>
          <select>
              <option>English (English)</option>
              <option>Hindi (हिंदी)</option>
              <option>Spanish (Español)</option>
              <option>French (Français)</option>
          </select>
      </div>
      <small class="text-white">Choose language - Changes will be applied after restarting the app</small>

  </section>

    <!-- Email Notifications -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <label class="text-light mb-0">Email Notifications</label>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="emailNotify" checked>
      </div>
    </div>

    <!-- Save Button -->
     <div class="col-6">
    <button type="submit" class="save-btn">Save Changes</button>
  </div>
  </form>
</div>
