<div class="container-fluid p-4">
    <!-- Fetched Songs from Backend -->
    <h5 class="mb-3 head">Uploaded Songs</h5>
    <div class="scroll-container mb-5">
        <div class="row flex-nowrap">
            <div class="col-2" *ngFor="let song of backendSongs">
                <img [src]="song.image || '../assets/Mask Group.png'" alt="cover" class="album-img mb-2">
                <div class="album-title">{{ song.title }}</div>
                <div class="album-artist">{{ song.artist }}</div>
            </div>
        </div>
    </div>

    <!-- Upload Songs Button -->
    <div class="mt-2">
        <button class="btn btn-success" (click)="uploadInput.click()">Upload Songs</button>
        <input type="file" #uploadInput accept="audio/*" multiple (change)="uploadSongs($event)" hidden />
    </div>

    <!-- Display Imported Songs -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 head" *ngIf="importedSongs.length">Recommended Songs</h5>

        <!-- Import Songs Button -->
        <div>
            <button class="btn btn-primary" (click)="fileInput.click()">Import Songs</button>
            <input type="file" #fileInput accept="audio/*" multiple (change)="loadFiles($event)" hidden />
        </div>
    </div>


    <div class="scroll-container mb-5" *ngIf="importedSongs.length">
        <div class="row flex-nowrap">
            <div class="col-2" *ngFor="let song of importedSongs; let i = index" (click)="togglePlay(i)">
                <img [src]="song.image" alt="cover" class="album-img mb-2" />
                <div class="album-title">{{ song.name }}</div>

                <!-- Hidden Audio -->
                <audio #audioRef [src]="song.src" (timeupdate)="updateTime($event, i)"
                    (loadedmetadata)="Duration($event, i)" style="display: none"></audio>

                <!-- Time Display -->
                <div class="album-artist">
                    {{ song.currentTime | number:'1.0-0' }} / {{ song.duration | number:'1.0-0' }} sec
                </div>
            </div>
        </div>
    </div>


    <!-- Recommended -->
    <!-- <h5 class="mb-3 head">Recommended for you</h5>

</div>
