<div
  class="sidebar"
  [class.expanded]="isExpanded"
  (mouseenter)="expandSidebar()"
  (mouseleave)="collapseSidebar()"
>
  <nav class="nav-menu">
    <ul>

      <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <a routerLink="/home" class="nav-link">
          <i class="bi bi-house-door nav-icon"></i>
          <span class="nav-text" *ngIf="isExpanded">Home</span>
        </a>
      </li>

      <li routerLinkActive="active">
        <a routerLink="/liked-songs" class="nav-link">
          <i class="bi bi-heart nav-icon"></i>
          <span class="nav-text" *ngIf="isExpanded">Liked Songs</span>
        </a>
      </li>

      <li routerLinkActive="active">
        <a routerLink="/about-us" class="nav-link">
          <i class="bi bi-chat-dots nav-icon"></i>
          <span class="nav-text" *ngIf="isExpanded">About Us</span>
        </a>
      </li>

      <li routerLinkActive="active">
        <a routerLink="/faq" class="nav-link">
          <i class="bi bi-question-circle nav-icon"></i>
          <span class="nav-text" *ngIf="isExpanded">FAQs</span>
        </a>
      </li>

      <li routerLinkActive="active">
        <a routerLink="/profile" class="nav-link">
            <!-- Bootstrap Icons hollow user icon -->
            <i class="bi bi-person nav-icon"></i>
            
            <!-- Alternative hollow icons -->
            <!-- <i class="bi bi-person-circle nav-icon"></i> -->
            <!-- <i class="bi bi-person-square nav-icon"></i> -->
            
            <span class="nav-text" *ngIf="isExpanded">PROFILE</span>
        </a>
    </li>

      <li routerLinkActive="active">
        <a routerLink="/settings" class="nav-link">
          <i class="bi bi-gear nav-icon"></i>
          <span class="nav-text" *ngIf="isExpanded">Settings</span>
        </a>
      </li>

    </ul>
  </nav>
</div>
