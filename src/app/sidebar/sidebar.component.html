<div class="d-flex justify-content-between align-items-center mb-4">

    <!-- Hamburger Icon -->
    <i class="bi bi-list text-white fs-3 hamburger" (click)="toggleSidebar()"></i>

    <!-- Sidebar -->
    <div #sidebar class="sidebar bg-dark text-white" [class.active]="isSidebarVisible">
        <i class="bi bi-x fs-4 close-btn" (click)="toggleSidebar()"></i>
        <ul class="list-unstyled mt-4 ps-3">
          <li><i class="bi bi-person me-2"></i>Profile</li>
          <li><i class="bi bi-heart me-2"></i>Liked Songs</li>
          <li><i class="bi bi-globe me-2"></i>Language</li>
          <li><i class="bi bi-chat-dots me-2"></i>Contact us</li>
          <li><i class="bi bi-question-circle me-2"></i>FAQs</li>
          <li><i class="bi bi-gear me-2"></i>Settings</li>
        </ul>
      </div>
      
      <!-- Backdrop (clicking on it closes sidebar) -->
      <div class="sidebar-backdrop" *ngIf="isSidebarVisible" (click)="toggleSidebar()"></div>

    <i class="bi bi-search text-white fs-3"></i>
</div>
